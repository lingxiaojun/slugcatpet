[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slugcatpet"
version = "1.3.4"
description = "Slugcat desktop pet for Windows: Rain World slugcat companions, bilingual (zh/en)."
readme = "README.md"
license = "MIT"
authors = [
    { name = "patatachip8", email = "patatachip8@outlook.com" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "PySide6>=6.10.0",
    "UnityPy>=1.23.0",
    "numpy>=2.3.0",
    "Pillow>=12.0.0",
]

[dependency-groups]
dev = ["ruff==0.17.0"]

[project.urls]
Repository = "https://github.com/lingxiaojun/slugcatpet"

[project.gui-scripts]
slugcatpet = "slugcatpet.main:main"

[tool.setuptools.packages.find]
include = ["slugcatpet*", "lizardpet*"]

[tool.setuptools.package-data]
slugcatpet = [
    "resources/icons/*.svg",
    "resources/layouts/*.json",
    "resources/characters/*.json",
    "resources/arcs.json.gz",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"slugcatpet/rendering/graphics.py" = ["E402"]   # 与 graphics_draw 互相引用，导入放在函数后
